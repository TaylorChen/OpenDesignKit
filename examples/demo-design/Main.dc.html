<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>OpenClaudeDesign Showcase Card</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 960px; height: 600px; box-sizing: border-box; background: {{bg}}; color: {{ink}}; padding: 56px 64px; display: flex; flex-direction: column; gap: 40px; font-family: inherit">
  <!-- Header -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">OpenClaudeDesign</p>
    <h1 style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1.15">面向全 Agent 的设计套件</h1>
    <p style="margin: 0; font-size: 22px; color: {{inkSoft}}">三个 Skill · 纯文件格式 · 零依赖校验</p>
  </div>

  <!-- Pillars -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{pillars}}" as="pillar" hint-placeholder-count="3">
      <div style="background: {{cardBg}}; border: 1px solid {{border}}; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 28px; font-weight: 700; color: {{accent}}">{{ pillar.num }}</span>
        <h3 style="margin: 0; font-size: 24px; font-weight: 600">{{ pillar.name }}</h3>
        <p style="margin: 0; font-size: 17px; line-height: 1.5; color: {{inkSoft}}">{{ pillar.desc }}</p>
      </div>
    </sc-for>
  </div>

  <!-- Interactive footer: accent swatches -->
  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid {{border}}; padding-top: 28px">
    <p style="margin: 0; font-size: 17px; color: {{inkSoft}}">点击色板切换主题色（演示画板交互）</p>
    <div style="display: flex; gap: 12px">
      <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="4">
        <div onClick="{{ sw.pick }}" style="width: 40px; height: 40px; border-radius: 999px; background: {{ sw.value }}; cursor: pointer; border: {{ sw.ringStyle }}"></div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"density":{"editor":"enum","options":["comfortable","compact"],"default":"comfortable"},"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    var accents = ['#c2410c', '#0e7490', '#7c3aed', '#be185d'];
    var picked = this.state.picked ?? '#c2410c';
    var dark = (this.props.density === 'compact');
    var self = this;
    return {
      accent: picked,
      bg: dark ? '#141413' : '#faf9f5',
      cardBg: dark ? '#1f1e1c' : '#ffffff',
      border: dark ? '#344054' : '#eaecf0',
      ink: dark ? '#ffffff' : '#141413',
      inkSoft: dark ? '#98a2b3' : '#475467',
      pillars: [
        { num: '01', name: 'Claude Design', desc: '画布级画板系统：.dc.html 组件 + DCLogic 状态机制，支持交互原型。' },
        { num: '02', name: 'Claude Slides', desc: 'deck.json + 每页一个 HTML 文件，任何查看器都能直接渲染。' },
        { num: '03', name: 'Design System', desc: 'tokens.json 单一事实源，编译为 CSS 变量供所有画板复用。' }
      ],
      swatches: accents.map(function (c) {
        var sel = (c === picked);
        return {
          value: c,
          ringStyle: sel ? '3px solid ' + c : '1px solid transparent',
          pick: function () { self.setState({ picked: c }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
