[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesignkit"
version = "0.1.2"
description = "Industrial-grade design suite for every AI agent: open-design / open-slides / open-design-system skills, validator, scaffolds, slide player, tokens compiler."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TaylorChen" }]
keywords = ["agent-skills", "design-system", "slides", "html", "validator", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Pre-processors",
]

[project.scripts]
odk = "odk.cli:main"

[tool.setuptools]
packages = ["odk"]

[tool.setuptools.package-data]
odk = ["templates/*"]

[project.urls]
Homepage = "https://github.com/TaylorChen/OpenDesignKit"
Issues = "https://github.com/TaylorChen/OpenDesignKit/issues"
Changelog = "https://github.com/TaylorChen/OpenDesignKit/blob/main/CHANGELOG.md"
